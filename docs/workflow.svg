<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" font-family="Helvetica, Arial, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <style>
      .stage{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.5}
      .gate{fill:#ecfdf5;stroke:#059669;stroke-width:1.5}
      .hook{fill:#fef2f2;stroke:#dc2626;stroke-width:1.5}
      .file{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:4 3}
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .st{font-size:13.5px}
      .m{font-size:12px;fill:#475569}
      .s{font-size:12px;fill:#334155}
      .h{font-size:13px;font-weight:700;fill:#64748b;letter-spacing:.06em}
      .flow{stroke:#475569;stroke-width:1.6;fill:none}
      .back{stroke:#b45309;stroke-width:1.5;fill:none;stroke-dasharray:6 4}
      .data{stroke:#94a3b8;stroke-width:1.2;fill:none;stroke-dasharray:3 3}
      .bl{font-size:11.5px;fill:#b45309;paint-order:stroke;stroke:#ffffff;stroke-width:4px}
    </style>
  </defs>
  <rect width="1240" height="720" fill="#ffffff"/>

  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">LLM Study Harness — one Sprint cycle per concept (~55–65 min)</text>
  <text x="30" y="58" class="m">Master doc Part 2. Stage gates are judged by the LLM; dashed orange arrows are the backward routes.</text>

  <text x="30" y="92" class="h">SPRINT · 7 STAGES</text>
  <g>
    <rect class="stage" x="24" y="102" width="160" height="92" rx="10"/>
    <text x="36" y="126" class="t st">1 SCAN</text><text x="36" y="144" class="m">5 min</text>
    <text x="36" y="164" class="s">chapter structure =</text><text x="36" y="180" class="s">coverage list → disk</text>
    <rect class="stage" x="196" y="102" width="160" height="92" rx="10"/>
    <text x="208" y="126" class="t st">2 PRE-ATTEMPT</text><text x="208" y="144" class="m">5–10 min · LLM silent</text>
    <text x="208" y="164" class="s">retrieve before</text><text x="208" y="180" class="s">instruction (pretesting)</text>
    <rect class="stage" x="368" y="102" width="160" height="92" rx="10"/>
    <text x="380" y="126" class="t st">3 WORKED EXAMPLE</text><text x="380" y="144" class="m">10–15 min</text>
    <text x="380" y="164" class="s">self-explain the</text><text x="380" y="180" class="s">principle-bearing steps</text>
    <rect class="stage" x="540" y="102" width="160" height="92" rx="10"/>
    <text x="552" y="126" class="t st">4 FADED PRACTICE</text><text x="552" y="144" class="m">10 min</text>
    <text x="552" y="164" class="s">steps removed until an</text><text x="552" y="180" class="s">independent solve</text>
    <rect class="stage" x="712" y="102" width="160" height="92" rx="10"/>
    <text x="724" y="126" class="t st">5 RETRIEVAL</text><text x="724" y="144" class="m">10 min</text>
    <text x="724" y="164" class="s">cued free recall</text><text x="724" y="180" class="s">+ /feynman (optional)</text>
    <rect class="stage" x="884" y="102" width="160" height="92" rx="10"/>
    <text x="896" y="126" class="t st">6 CALIBRATION</text><text x="896" y="144" class="m">5 min</text>
    <text x="896" y="164" class="s">you predict 0–5 first,</text><text x="896" y="180" class="s">then the LLM estimate</text>
    <rect class="stage" x="1056" y="102" width="160" height="92" rx="10"/>
    <text x="1068" y="126" class="t st">7 STORE</text><text x="1068" y="144" class="m">5 min</text>
    <text x="1068" y="164" class="s">/makeremnote cards</text><text x="1068" y="180" class="s">(optional)</text>
  </g>
  <g>
    <line class="flow" x1="184" y1="148" x2="194" y2="148" marker-end="url(#a)"/>
    <line class="flow" x1="356" y1="148" x2="366" y2="148" marker-end="url(#a)"/>
    <line class="flow" x1="528" y1="148" x2="538" y2="148" marker-end="url(#a)"/>
    <line class="flow" x1="700" y1="148" x2="710" y2="148" marker-end="url(#a)"/>
    <line class="flow" x1="872" y1="148" x2="882" y2="148" marker-end="url(#a)"/>
    <line class="flow" x1="1044" y1="148" x2="1054" y2="148" marker-end="url(#a)"/>
  </g>
  <!-- backward routes to stage 3 -->
  <path class="back" d="M620,194 V222 H500 V198" marker-end="url(#r)"/>
  <text x="514" y="216" class="bl">structural fail</text>
  <path class="back" d="M792,194 V252 H460 V198" marker-end="url(#r)"/>
  <text x="520" y="246" class="bl">most components missed</text>
  <path class="back" d="M964,194 V282 H420 V198" marker-end="url(#r)"/>
  <text x="520" y="276" class="bl">confidence gap ≥ 2 + weak prerequisite</text>

  <text x="456" y="356" class="h">CONCEPT EXIT</text>
  <path class="flow" d="M1136,194 L1136,330 L1080,330 L1080,368" marker-end="url(#a)"/>
  <rect class="gate" x="830" y="370" width="380" height="108" rx="10"/>
  <text x="844" y="394" class="t">Cold coverage judge (§2.7.3)</text>
  <text x="844" y="414" class="s">fresh subagent: coverage file + this concept's raw turns</text>
  <text x="844" y="432" class="s">never mentioned → auto-fill once</text>
  <text x="844" y="450" class="s">detour or LLM-only → you decide taught / refill</text>
  <text x="844" y="468" class="s">all items covered → judged: true</text>

  <line class="flow" x1="830" y1="424" x2="776" y2="424" marker-end="url(#a)"/>
  <rect class="gate" x="456" y="370" width="318" height="108" rx="10"/>
  <text x="470" y="394" class="t">Exam gate (§2.7.2, optional)</text>
  <text x="470" y="414" class="s">all required concepts of a past-exam</text>
  <text x="470" y="432" class="s">problem learned → solve the original</text>
  <text x="470" y="450" class="s">(needs past_exams/analysis/, external)</text>

  <line class="flow" x1="456" y1="424" x2="402" y2="424" marker-end="url(#a)"/>
  <rect class="stage" x="214" y="384" width="186" height="80" rx="10"/>
  <text x="228" y="410" class="t">Next concept?</text>
  <text x="228" y="430" class="s">yes → new cycle at SCAN</text>
  <text x="228" y="448" class="s">no → end the session</text>
  <path class="flow" d="M214,424 L104,424 L104,196" marker-end="url(#a)"/>
  <text x="112" y="320" class="m">next concept</text>

  <text x="30" y="530" class="h">SESSION END</text>
  <path class="flow" d="M306,464 L306,548" marker-end="url(#a)"/>
  <rect class="stage" x="214" y="550" width="186" height="74" rx="10"/>
  <text x="228" y="576" class="t">You: "done for today"</text>
  <text x="228" y="596" class="s">or /makereview, "stop"</text>
  <text x="228" y="612" class="s">(whole prompt only)</text>

  <line class="flow" x1="400" y1="587" x2="454" y2="587" marker-end="url(#a)"/>
  <rect class="hook" x="456" y="544" width="318" height="86" rx="10"/>
  <text x="470" y="568" class="t">Hook: UserPromptSubmit</text>
  <text x="470" y="588" class="s">any coverage file with judged: false,</text>
  <text x="470" y="606" class="s">modified in the last 48 h?</text>
  <text x="470" y="622" class="m">coverage_judge_gate.sh</text>

  <line class="flow" x1="774" y1="566" x2="828" y2="566" marker-end="url(#a)"/>
  <text x="784" y="558" class="m">yes</text>
  <rect class="hook" x="830" y="536" width="380" height="58" rx="10"/>
  <text x="844" y="560" class="t">Blocked — message to you</text>
  <text x="844" y="580" class="s">"run the coverage judge" → judge runs → send end again</text>
  <path class="flow" d="M1020,536 L1020,480" marker-end="url(#a)"/>

  <line class="flow" x1="774" y1="612" x2="828" y2="636" marker-end="url(#a)"/>
  <text x="784" y="640" class="m">no</text>
  <rect class="gate" x="830" y="610" width="380" height="58" rx="10"/>
  <text x="844" y="634" class="t">/makereview</text>
  <text x="844" y="654" class="s">review md (Self-Test, no answers) + syllabus grid O</text>

  <!-- data files -->
  <rect class="file" x="30" y="650" width="560" height="50" rx="8"/>
  <text x="44" y="671" class="s">Course folder: Reviews/&lt;unit&gt;_coverage.md · &lt;unit&gt;_review.md · weaklog.md · prereq_track.md</text>
  <text x="44" y="689" class="m">Gaps found in stages 3–6 are appended to weaklog.md; review sessions later read it first.</text>
</svg>
